spring.application.name=KnowledgeManager

# ============================================================
# KnowledgeManager configuration
# 所有敏感项均通过环境变量注入；本地未设置时使用安全的开发默认值。
# ============================================================

# JVM 内存（向量化/大文档处理时建议 -Xms4g -Xmx4g）
# JAVA_OPTS=-Xms4g -Xmx4g

# 排除 Milvus 自动配置，改用自定义 MilvusConfig（通过 MilvusAvailableCondition 检测可达性）
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/knowledge_manager?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- MyBatis / PageHelper ----------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=zjc.knowledgemanager.entity
mybatis.configuration.map-underscore-to-camel-case=true
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
pagehelper.params=count=countSql

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:knowledgeManagerDevSecretKey2024ForJWTTokenGenerationWithEnoughLengthForSecurity}
jwt.expiration=86400000

# ---------- Server ----------
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never
server.tomcat.connection-timeout=360000
server.tomcat.max-http-form-post-size=50MB

# ---------- SpringDoc ----------
logging.level.org.springdoc=INFO
springdoc.cache.disabled=true

# ---------- SiliconFlow / OpenAI-compatible ----------
# base-url 不含 /v1，Spring AI 默认 completions-path 已包含 /v1
spring.ai.openai.api-key=${SILICONFLOW_API_KEY:not-configured}
spring.ai.openai.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn}

# ===== 模型分层配置 =====
spring.ai.openai.chat.options.model=Qwen/Qwen3.5-9B
spring.ai.openai.embedding.options.model=Qwen/Qwen3-Embedding-4B
app.ai.default-model=Qwen/Qwen3.5-9B
app.ai.default-temperature=0.7
# 主模型连续失败 3 次后自动切换
app.ai.fallback-model=Qwen/Qwen3-8B

# ===== 超时配置（大模型推理时间更长） =====
spring.ai.openai.chat.options.timeout=300000
spring.ai.openai.embedding.options.timeout=60000
spring.ai.rest.client.connect-timeout=10000
spring.ai.rest.client.read-timeout=300000

# ---------- Redis ----------
spring.ai.memory.redis.host=${REDIS_HOST:localhost}
spring.ai.memory.redis.port=${REDIS_PORT:6379}
spring.ai.memory.redis.password=${REDIS_PASSWORD:}
spring.ai.memory.redis.timeout=2000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000

# ---------- Milvus ----------
spring.ai.vectorstore.milvus.client.host=${MILVUS_HOST:localhost}
spring.ai.vectorstore.milvus.client.port=${MILVUS_PORT:19530}
spring.ai.vectorstore.milvus.client.username=${MILVUS_USERNAME:root}
spring.ai.vectorstore.milvus.client.password=${MILVUS_PASSWORD:milvus}
spring.ai.vectorstore.milvus.initialize-schema=true
spring.ai.vectorstore.milvus.databaseName=${MILVUS_DATABASE_NAME:default}
spring.ai.vectorstore.milvus.collectionName=${MILVUS_COLLECTION_NAME:vector_store_v6}
spring.ai.vectorstore.milvus.embeddingDimension=2560
spring.ai.vectorstore.milvus.indexType=IVF_FLAT
spring.ai.vectorstore.milvus.metricType=COSINE
spring.ai.vectorstore.milvus.contentFieldName=content
spring.ai.vectorstore.milvus.embeddingFieldName=vector
spring.ai.vectorstore.milvus.metadataFieldName=metadata

# ---------- Upload ----------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload.base-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.location=${FILE_UPLOAD_TMP_DIR:./uploads/tmp}

# ---------- AI ----------
# 需要 Redis 与 Milvus；Milvus 不可达时应用仍可启动，向量检索/文件入库自动降级
app.ai.enabled=${APP_AI_ENABLED:true}

# 长短期记忆
app.ai.memory.long-term.enabled=true
app.ai.memory.long-term.collection-name=long_term_memory
app.ai.memory.long-term.retrieval-top-k=5
app.ai.memory.long-term.retrieval-threshold=0.7
app.ai.memory.long-term.merge-threshold=0.85
app.ai.memory.long-term.extraction-max-per-turn=5
app.ai.memory.long-term.extraction-model=Qwen/Qwen3.5-9B
app.ai.memory.long-term.ttl-days=90
app.ai.memory.long-term.max-memories-per-user=500
app.ai.memory.long-term.eviction-importance-threshold=2.0
# similarity=语义重叠即视为冲突 / llm=LLM 判断是否真正矛盾
app.ai.memory.long-term.conflict-detection-mode=similarity
app.ai.memory.short-term.window-size=30

# 用户画像（Redis Hash + LLM 异步更新）
app.ai.memory.user-profile.enabled=true
app.ai.memory.user-profile.extraction-model=Qwen/Qwen3.5-9B

# 渐进式摘要压缩
app.ai.memory.compression.enabled=true
app.ai.memory.compression.trigger-round-count=20
app.ai.memory.compression.summary-max-length=200
app.ai.memory.compression.summary-model=Qwen/Qwen3.5-4B
app.ai.memory.compression.collection-name=conversation_summaries

# Token 预算
app.ai.memory.token-budget.enabled=true
app.ai.memory.token-budget.max-system-tokens=3000
app.ai.memory.token-budget.user-message-reserve=2000

# A/B 实验
app.ai.memory.experiment.enabled=false
app.ai.memory.experiment.default-group=A
app.ai.memory.experiment.group-a-top-k=5
app.ai.memory.experiment.group-b-top-k=8
app.ai.memory.experiment.group-b-threshold=0.6
app.ai.memory.experiment.group-b-ratio=0.5

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=knowledge-manager
